[package]
name = "right-this-way"
version = "0.1.1"
edition = "2024"
description = "Repository-local proven patterns for coding agents"
repository = "https://github.com/lucasrgt/right-this-way"
license = "MIT"
readme = "README.md"

[workspace]
members = ["xtask"]
resolver = "3"

[lib]
name = "rtw"

[[bin]]
name = "rtw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
glob = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ulid = "3"

[dev-dependencies]
tempfile = "3"
